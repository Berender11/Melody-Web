<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Melody Web</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.png">
  <link rel="icon" href="icons/icon.png">
</head>

<body>
  <nav>
    <div class="nav-left">
      <img src="images/logo.png" alt="Spotify">
      <p>Melody Web</p>
    </div>
    <div class="nav-right">
      <a href="#">Home</a>
      <a href="About.html">About</a>
    </div>
  </nav>

  <div class="container">
    <div class="songList">
      <h1>Echoes of Stardust</h1>
      <div id="songListContainer" class="songItemcontainer"></div>
    </div>
  </div>

  <div class="bottom">
  <div class="controls-bar">
    <div class="time-progress">
      <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
   </div>

    <input type="range" min="0" max="100" value="0" id="songBar">
    
    <div class="volume-controls">
      <img class="volumeIcon" src="icons/volume-high-solid.svg" alt="">
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="songInfo">
      <img src="images/playing.gif" width="28px" id="gif" alt="gif">
      <div id="masterSongName">
        <span class="track-title">No song</span>
        <span class="track-artist">playing</span>
      </div>
    </div>
  </div>

  <div class="icons">
    <img src="icons/backward-solid.svg" id="previousBtn">
    <img src="icons/play-solid.svg" id="masterPlay">
    <img src="icons/forward-solid.svg" id="nextBtn">
  </div>
</div>

<script src="script.js"></script>
</body>

</html>
